name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The editor (/keystatic) and the form endpoint (/api) run on Vercel, not on Pages.
      - name: Prepare static build
        run: node scripts/prepare-pages.mjs
      - run: npm run build
        env:
          PAGES_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: https://projectinspyr.github.io
          NEXT_PUBLIC_FORM_ENDPOINT: https://project-inspyr.vercel.app/api/reach-out
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
